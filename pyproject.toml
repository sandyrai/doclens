[project]
name = "ai-document-agent"
version = "0.5.0"
description = "DocLens: an AI document analysis engine with hybrid RAG search, agentic tool calling and provider-agnostic LLMs"
readme = "README.md"
authors = [
    { name = "Sandeep Kumar" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb>=1.0",
    "fastapi>=0.141.1",
    "ollama>=0.6.2",
    "pydantic>=2.13.4",
    "pymupdf>=1.25",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.20",
    "uvicorn>=0.52.3",
    "rank-bm25>=0.2.2",
    "python-docx>=1.0",
    "openai>=3.3.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.28",
]

[project.scripts]
ai-document-agent = "ai_document_agent:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_document_agent"]
